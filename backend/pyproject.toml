[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-platform-backend"
version = "0.1.0"
description = "AI for Digital Infrastructure & Governance citizen feedback API and worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "google-genai>=1.0,<2",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.9,<1",
]

[project.scripts]
civic-platform-worker = "app.workers.runner:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
